<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8b339'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%231a1205'%3EA%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="app.css?v=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <header class="appbar">
        <div class="brand">
            <div class="brand__mark">A</div>
            <div class="brand__name">Account <span>Analyzer</span></div>
        </div>
        <nav class="nav">
            <a href="deduction.html" class="btn btn--ghost">Deducciones</a>
            <a href="/h2-console" class="btn btn--ghost">Consola H2</a>
            <button id="bClose" class="btn btn--danger">Cerrar</button>
        </nav>
    </header>

    <main class="shell">
        <div class="lede rise">
            <h1>Analiza tu estado de cuenta</h1>
            <p>Sube el estado de cuenta de tu banco y extrae automáticamente impuestos, comisiones, intereses y recargos por mora.</p>
        </div>

        <div class="workspace">
            <!-- left: upload form -->
            <section class="card panel rise" style="animation-delay:.05s">
                <div class="card__body">
                    <form id="form" method="POST" action="account/analyze" enctype="multipart/form-data">
                        <div class="field">
                            <label class="label" for="file">Archivo</label>
                            <label class="dropzone" id="dropzone">
                                <input type="file" name="file" id="file" accept=".csv,.pdf,.xls,.xlsx" required>
                                <svg class="dropzone__icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                <span class="dropzone__prompt">Arrastra o haz clic</span>
                                <span class="dropzone__hint">CSV, PDF o Excel</span>
                                <span class="dropzone__file" id="fileName"></span>
                            </label>
                        </div>

                        <div class="field">
                            <label class="label" for="bank">Banco</label>
                            <select class="select" name="bank" id="bank">
                                <option value="PopularPDF">Popular · PDF</option>
                                <option value="Popular">Popular · CSV</option>
                                <option value="BHD">BHD · Excel (Alpha)</option>
                                <option value="BHDPDF">BHD · PDF (Alpha)</option>
                                <option value="Scotiabank">Scotiabank · PDF (pre-Alpha)</option>
                            </select>
                        </div>

                        <div class="field">
                            <label class="label" for="pass">Contraseña del PDF</label>
                            <input class="input" type="password" name="pass" id="pass" autocomplete="off" placeholder="Opcional">
                        </div>

                        <button type="submit" class="btn btn--primary btn--block" id="button">
                            Analizar
                        </button>
                    </form>
                </div>
            </section>

            <!-- right: results -->
            <section class="card results rise" id="results" style="animation-delay:.1s">
                <div class="state" id="emptyState">
                    <svg class="state__icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
                    <h3>Sin análisis aún</h3>
                    <p>Selecciona un archivo y un banco, luego presiona <strong>Analizar</strong> para ver el desglose.</p>
                </div>
            </section>
        </div>
    </main>

    <script src="index.js?v=1"></script>
</body>
</html>
